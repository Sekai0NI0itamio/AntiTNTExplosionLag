name: benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle test benchmark --no-daemon --warning-mode all
      - run: cat build/reports/antitnt-benchmark/BENCHMARK-REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: antitntexplosionlag-benchmark
          path: build/reports/antitnt-benchmark/BENCHMARK-REPORT.md
